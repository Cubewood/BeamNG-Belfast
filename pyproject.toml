[project]
name = "beamng-belfast"
version = "0.1.0"
description = "BeamNG Belfast map and data tooling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pyproj",
    "shapely",
    "rasterio",
    "geopandas",
    "osmium",
    "pyyaml",
    "requests",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
