  - id: bus_lane_1049a
    name: Bus lane boundary line
    diagram: "1049A"
    diagram_ni: "1049"
    category: longitudinal
    colour: white
    geometry: {kind: continuous, width_mm: [250, 300], default_width_mm: 250}
    width_by_speed: {speed_under_40: 250, speed_40_or_more: 300}
    applies:
      road_types: [bus_lane, with_flow_lane]
      speed_limit_mph: {}
      notes: Continuous. No road studs. The lane starts with a broken line 1010 of the same width at a taper no sharper than 1:10. The lane should be 4.25 m wide, 4 m at least, 3 m minimum recommended. The BUS LANE legend (1048) is white. The Belfast slice has none tagged.
